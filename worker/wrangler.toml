name = "rate-my-poo-api"
# Public account identifier taken from the Cloudflare dashboard URL shared by the site owner.
account_id = "2b6e95dbd59fadf88d69fc5e474a6562"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[images]
binding = "IMAGES"

[vars]
RMP_ALLOWED_ORIGINS = "https://frazmcc.github.io,https://rate-my-poo.com,https://www.rate-my-poo.com"

# Static HTML, CSS and JavaScript are delivered directly by Cloudflare's CDN;
# dynamic API requests and canonical navigation redirects invoke the Worker.\n# Asset files (CSS/JS/images) continue to bypass the Worker at the edge.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/", "/how-it-works*", "/community-guidelines*"]

# Public hostname for the live website; Cloudflare manages DNS and TLS.
[[routes]]
pattern = "www.rate-my-poo.com"
custom_domain = true

# Make the bare domain resolvable using the same Worker origin.
[[routes]]
pattern = "rate-my-poo.com"
custom_domain = true
