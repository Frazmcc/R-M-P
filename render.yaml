# Free-only deployment: Render Free web service + persistent Neon Free PostgreSQL.
# DO NOT add a Render Free PostgreSQL database: it expires after 30 days.
# Create a Neon Free project separately and supply DATABASE_URL as a private secret.
services:
  - type: web
    name: rmp-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RMP_ADMIN_TOKEN
        sync: false
      - key: RMP_SECRET_KEY
        generateValue: true
      - key: RMP_ALLOWED_ORIGINS
        value: https://frazmcc.github.io,https://rate-my-poo.com,https://www.rate-my-poo.com
