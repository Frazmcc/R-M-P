# Optional preview deployment. Render Free Postgres expires after 30 days.
# For a lasting public site, choose a persistent, backed-up paid database.
services:
  - type: web
    name: rmp-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rmp-data
          property: connectionString
      - key: RMP_ADMIN_TOKEN
        sync: false
      - key: RMP_SECRET_KEY
        generateValue: true
      - key: RMP_ALLOWED_ORIGINS
        value: https://frazmcc.github.io,https://rate-my-poo.com,https://www.rate-my-poo.com
databases:
  - name: rmp-data
    region: frankfurt
    plan: free
    ipAllowList: []
