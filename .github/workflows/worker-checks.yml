name: Cloudflare Worker checks

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-checks.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-checks.yml'

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
      - name: Install dependencies
        run: npm ci --prefix worker --no-audit --no-fund
      - name: Run API privacy and moderation tests
        run: npm run --prefix worker test
      - name: Check Cloudflare bundle
        run: npm run --prefix worker check

  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
      - name: Install browser test dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        working-directory: worker
        run: npx playwright install --with-deps chromium
      - name: Test phone, landscape and desktop layouts
        working-directory: worker
        run: npm run test:mobile
      - name: Upload screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-browser-failure
          path: worker/test-results/
          if-no-files-found: ignore
