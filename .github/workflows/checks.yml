name: Site checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend HTML and JavaScript
        run: |
          node --check static/site.js
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          assert.match(html,/<!doctype html>/i);
          assert.match(html,/<meta name="viewport"/i);
          assert.match(html,/<main[ >]/i);
          assert.match(html,/id="upload-form"/);
          assert.match(html,/id="admin-page"/);
          assert.doesNotMatch(html,/<iframe|googletag|adsbygoogle|doubleclick\.net/i);
          const js=fs.readFileSync('static/site.js','utf8');
          assert.match(js,/api\/upload/);
          assert.match(js,/api\/admin/);
          const deployment=fs.readFileSync('render.yaml','utf8');
          assert.match(deployment,/plan:\\s*free/);
          assert.match(deployment,/key:\\s*DATABASE_URL[\\s\\S]*?sync:\\s*false/);
          assert.doesNotMatch(deployment,/^databases:/m);
          console.log('Front-end and free-only deployment checks passed.');
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend integration tests
        run: python -m pytest -q
